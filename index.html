<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
</head>
<body align="center" >
    <h1>Choose a Color</h1>
    <input type="color" id="colorPicker" value="#ff0000">
    <p>Selected Color (Hex): <span id="selectedColor">#ff0000</span></p>
    <p>Selected Color (RGB): <span id="selectedRGB">rgb(255, 0, 0)</span></p>

    <script>
        const colorPicker = document.getElementById('colorPicker');
        const selectedColor = document.getElementById('selectedColor');
        const selectedRGB = document.getElementById('selectedRGB');

        function hexToRgb(hex) {
            const bigint = parseInt(hex.slice(1), 16);
            const r = (bigint >> 16) & 255;
            const g = (bigint >> 8) & 255;
            const b = bigint & 255;
            return `rgb(${r}, ${g}, ${b})`;
        }

        colorPicker.addEventListener('input', (event) => {
            const hexValue = event.target.value;
            selectedColor.textContent = hexValue;
            selectedRGB.textContent = hexToRgb(hexValue);
        });
    </script>
</body>
</html>
